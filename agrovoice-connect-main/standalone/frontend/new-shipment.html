<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>New Shipment — AgroVoice</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="brand">🌾 AgroVoice</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="new-shipment.html" class="active">New Shipment</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main class="container">
    <h1>Book a shipment</h1>
    <p class="muted">Fill in your details. Voice input can be added later.</p>

    <form id="shipment-form" class="card form">
      <label>Farmer name
        <input name="farmer_name" required />
      </label>
      <label>Phone
        <input name="farmer_phone" required />
      </label>
      <label>Village
        <input name="farmer_village" />
      </label>

      <hr />

      <label>Produce
        <input name="produce" placeholder="e.g. Tomatoes" required />
      </label>
      <label>Quantity (kg)
        <input name="quantity_kg" type="number" min="1" required />
      </label>
      <label>Pickup location
        <input name="pickup" required />
      </label>
      <label>Drop-off location (mandi)
        <input name="dropoff" required />
      </label>
      <label>Pickup date
        <input name="pickup_date" type="date" required />
      </label>

      <button type="submit" class="btn btn-primary">Save to Oracle</button>
      <p id="form-msg" class="status"></p>
    </form>
  </main>

  <script src="js/app.js"></script>
  <script>AgroVoice.wireShipmentForm();</script>
</body>
</html>
